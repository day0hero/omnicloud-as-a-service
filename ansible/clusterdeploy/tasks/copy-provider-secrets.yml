- name: "Check if shared BMC credentials secret exists in hive namespace"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ baremetal.bmcSharedSecretName }}"
    namespace: "hive"
  register: bmc_shared_creds_hive
  ignore_errors: true
  when:
    - cloud.provider == 'BareMetal'
    - baremetal.bmcCredentialsMode == 'shared'
    - not user_provided_credentials | default(false)

- name: "Copy shared BMC credentials secret from hive to {{ cluster.name }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ baremetal.bmcSharedSecretName }}"
        namespace: "{{ cluster.name }}"
      type: "{{ bmc_shared_creds_hive.resources[0].type }}"
      data: "{{ bmc_shared_creds_hive.resources[0].data }}"
  when:
    - cloud.provider == 'BareMetal'
    - baremetal.bmcCredentialsMode == 'shared'
    - not user_provided_credentials | default(false)
    - bmc_shared_creds_hive.resources is defined
    - bmc_shared_creds_hive.resources | length > 0

- name: "Check if per-host BMC credentials secrets exist in hive namespace"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ item.bmc.credentialsName | default('bmc-secret-' + item.name) }}"
    namespace: "hive"
  register: bmc_perhost_creds_hive
  ignore_errors: true
  loop: "{{ baremetal.hosts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - cloud.provider == 'BareMetal'
    - baremetal.bmcCredentialsMode == 'perHost'
    - not user_provided_credentials | default(false)

- name: "Copy per-host BMC credentials secrets from hive to {{ cluster.name }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item.item.bmc.credentialsName | default('bmc-secret-' + item.item.name) }}"
        namespace: "{{ cluster.name }}"
      type: "{{ item.resources[0].type }}"
      data: "{{ item.resources[0].data }}"
  loop: "{{ bmc_perhost_creds_hive.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when:
    - cloud.provider == 'BareMetal'
    - baremetal.bmcCredentialsMode == 'perHost'
    - not user_provided_credentials | default(false)
    - item.resources is defined
    - item.resources | length > 0

- name: "Check if global-pullsecret exists in hive namespace"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "global-pullsecret"
    namespace: "hive"
  register: pullsecret_hive
  ignore_errors: true
  when: not user_provided_credentials | default(false)

- name: "Copy global-pullsecret from hive to {{ cluster.name }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "global-pullsecret"
        namespace: "{{ cluster.name }}"
      type: "{{ pullsecret_hive.resources[0].type }}"
      data: "{{ pullsecret_hive.resources[0].data }}"
  when:
    - not user_provided_credentials | default(false)
    - pullsecret_hive.resources is defined
    - pullsecret_hive.resources | length > 0
