---
# provision-baremetal-lab defaults

# EC2 bare metal instance type
lab_instance_type: "c5.metal"
lab_instance_ebs_size: 500

# Lab network configuration
lab_network_name: "baremetal-net"
lab_network_cidr: "192.168.1.0/24"
lab_network_gateway: "192.168.1.1"
lab_network_dhcp_start: "192.168.1.100"
lab_network_dhcp_end: "192.168.1.199"
lab_dns_servers:
  - "192.168.1.1"

# sushy-tools configuration
sushy_listen_ip: "0.0.0.0"
sushy_listen_port: 8000
sushy_libvirt_uri: "qemu:///system"

# Default VM specs (can be overridden per-VM in lab_vms)
lab_vm_default_vcpu: 8
lab_vm_default_ram_mb: 32768
lab_vm_default_disk_gb: 120
lab_vm_default_os_variant: "rhel9-unknown"

# VM definitions for the simulated baremetal hosts
# Override this in baremetal-lab-vars.yml
lab_vms: []
# Example:
#   - name: master-0
#     role: master
#     vcpu: 8
#     ram_mb: 32768
#     disk_gb: 120
#     mac: "52:54:00:aa:00:01"
#     ip: "192.168.1.10"

# Path for VM disk images
lab_vm_disk_path: "/var/lib/libvirt/images"

# Query sushy-tools Redfish API to discover VM NIC interface names
lab_discover_nics: false

# Destroy flag
lab_destroy: false
