---
- name: Get VM UUIDs from libvirt
  community.libvirt.virt:
    command: info
    name: "{{ item.name }}"
  register: vm_info_results
  loop: "{{ lab_vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Get VM UUIDs via virsh
  ansible.builtin.command:
    cmd: "virsh domuuid {{ item.name }}"
  register: vm_uuid_results
  loop: "{{ lab_vms }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Build VM UUID map
  ansible.builtin.set_fact:
    vm_uuid_map: >-
      {{ vm_uuid_map | default({}) | combine({
        item.item.name: item.stdout | trim
      }) }}
  loop: "{{ vm_uuid_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Determine the metal instance public IP
  ansible.builtin.set_fact:
    metal_public_ip: "{{ ansible_host | default(inventory_hostname) }}"

- name: Query sushy-tools for VM Ethernet interfaces (NIC discovery)
  ansible.builtin.uri:
    url: "http://localhost:{{ sushy_listen_port }}/redfish/v1/Systems/{{ vm_uuid_map[item.name] }}/EthernetInterfaces"
    method: GET
    return_content: true
    status_code: [200, 404]
  register: _lab_nic_results
  loop: "{{ lab_vms }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: true
  when: lab_discover_nics | default(false) | bool

- name: Build discovered NIC interface map from sushy-tools
  ansible.builtin.set_fact:
    _lab_nic_map: >-
      {{ _lab_nic_map | default({}) | combine({
        item.item.name: 'enp' + (item.json.Members | first)['@odata.id'] | regex_replace('.*/([^/]+)$', '\1') + 's0'
      }) }}
  loop: "{{ _lab_nic_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when:
    - lab_discover_nics | default(false) | bool
    - item.json is defined
    - item.json.Members is defined
    - item.json.Members | length > 0
  ignore_errors: true

- name: Build baremetal_hosts list for cluster deployment
  ansible.builtin.set_fact:
    generated_baremetal_hosts: >-
      {{ generated_baremetal_hosts | default([]) + [{
        'name': item.name,
        'role': item.role,
        'bmc': {
          'address': 'redfish-virtualmedia://' + metal_public_ip + ':' + (sushy_listen_port | string) + '/redfish/v1/Systems/' + vm_uuid_map[item.name],
          'disableCertificateVerification': true
        },
        'bootMACAddress': item.mac,
        'rootDeviceHints': {
          'deviceName': item.root_device | default('/dev/vda')
        },
        'network': {
          'interface': (_lab_nic_map | default({}))[item.name] | default(item.interface | default('enp1s0')),
          'ip': item.ip,
          'prefix': item.prefix | default(24),
          'gateway': lab_network_gateway,
          'dns': lab_dns_servers
        }
      }] }}
  loop: "{{ lab_vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Display generated baremetal_hosts inventory
  ansible.builtin.debug:
    msg: "{{ generated_baremetal_hosts | to_nice_yaml }}"

- name: Write baremetal_hosts to file for use with clusterdeploy
  ansible.builtin.copy:
    content: |
      ---
      # Auto-generated by provision-baremetal-lab
      # Metal instance: {{ metal_public_ip }}
      # Generated: {{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -Iseconds')) }}

      baremetal_hosts: {{ generated_baremetal_hosts | to_nice_yaml(indent=2) }}

      baremetal_api_vip: "{{ lab_vms | map(attribute='ip') | list | first | regex_replace('\\.[0-9]+$', '.100') }}"
      baremetal_ingress_vip: "{{ lab_vms | map(attribute='ip') | list | first | regex_replace('\\.[0-9]+$', '.101') }}"
      baremetal_machine_network: "{{ lab_network_cidr }}"
      baremetal_provisioning_method: "assisted"
      baremetal_bmc_credentials_mode: "shared"
    dest: "{{ playbook_dir }}/generated-baremetal-hosts.yml"
    mode: "0644"
  delegate_to: localhost
  become: false
