apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: create-import-secret
  namespace: {{ .Values.pipelineNamespace }}
  labels:
    {{- include "cluster-deploy-pipelines.labels" . | nindent 4 }}
spec:
  description: Creates auto-import secret for ManagedCluster
  params:
  - name: cluster-name
    description: Name of the cluster
    type: string
  workspaces:
  - name: kubeconfig
    description: Workspace containing kubeconfig
  steps:
  - name: create-import-secret
    image: {{ .Values.kubectlImage }}
    script: |
      #!/bin/bash
      set -e
      
      CLUSTER_NAME=$(params.cluster-name)
      KUBECONFIG_B64=$(cat $(workspaces.kubeconfig.path)/kubeconfig | base64 -w 0)
      
      cat <<EOF | oc apply -f -
      apiVersion: v1
      kind: Secret
      metadata:
        name: auto-import-secret
        namespace: $CLUSTER_NAME
      type: Opaque
      data:
        kubeconfig: $KUBECONFIG_B64
      EOF
      
      echo "Auto-import secret created for $CLUSTER_NAME"
