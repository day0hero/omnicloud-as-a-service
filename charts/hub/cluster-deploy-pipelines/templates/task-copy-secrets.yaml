apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: create-externalsecrets
  labels:
    {{- include "cluster-deploy-pipelines.labels" . | nindent 4 }}
spec:
  description: Creates ExternalSecret objects for provider credentials and pull secret
  params:
  - name: cluster-name
    description: Name of the cluster
    type: string
  - name: cloud-provider
    description: Cloud provider (Amazon, Google, or Azure)
    type: string
  - name: secret-store-name
    description: Name of the ClusterSecretStore
    type: string
    default: "vault-backend"
  - name: aws-creds-key-path
    description: Vault path for AWS credentials
    type: string
    default: "secret/data/hub/aws"
  - name: gcp-creds-key-path
    description: Vault path for GCP credentials
    type: string
    default: "secret/data/hub/gcp"
  - name: azure-creds-key-path
    description: Vault path for Azure credentials
    type: string
    default: "secret/data/hub/azure"
  - name: pullsecret-key-path
    description: Vault path for pull secret
    type: string
    default: "pushsecrets/global-pull-secret"
  steps:
  - name: create-externalsecrets
    image: {{ .Values.kubectlImage }}
    script: |
      #!/bin/bash
      set -e
      
      CLUSTER_NAME=$(params.cluster-name)
      PROVIDER=$(params.cloud-provider)
      SECRET_STORE=$(params.secret-store-name)
      AWS_KEY=$(params.aws-creds-key-path)
      GCP_KEY=$(params.gcp-creds-key-path)
      AZURE_KEY=$(params.azure-creds-key-path)
      PULLSECRET_KEY=$(params.pullsecret-key-path)
      
      # Create AWS ExternalSecret
      if [ "$PROVIDER" = "Amazon" ] || [ "$PROVIDER" = "AWS" ]; then
        cat <<EOF | oc apply -f -
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: eso-aws-creds
        namespace: $CLUSTER_NAME
      spec:
        refreshInterval: 15s
        secretStoreRef:
          name: $SECRET_STORE
          kind: ClusterSecretStore
        target:
          name: aws-creds
          template:
            type: Opaque
        dataFrom:
        - extract:
            key: $AWS_KEY
      EOF
        echo "Created ExternalSecret for AWS credentials"
      fi
      
      # Create GCP ExternalSecret
      if [ "$PROVIDER" = "Google" ] || [ "$PROVIDER" = "GCP" ]; then
        cat <<EOF | sed "s/\$CLUSTER_NAME/$CLUSTER_NAME/g" | sed "s/\$SECRET_STORE/$SECRET_STORE/g" | sed "s|\$GCP_KEY|$GCP_KEY|g" | oc apply -f -
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: eso-gcp-creds
        namespace: \$CLUSTER_NAME
      spec:
        refreshInterval: 15s
        secretStoreRef:
          name: \$SECRET_STORE
          kind: ClusterSecretStore
        data:
        - secretKey: clientSecret
          remoteRef:
            key: \$GCP_KEY
            property: content
        target:
          name: gcp-creds
          creationPolicy: Owner
          template:
            type: Opaque
            mergePolicy: Replace
            data:
              osServiceAccount.json: >
                {{ "{{ .clientSecret | toString | trim }}" }}
      EOF
        echo "Created ExternalSecret for GCP credentials"
      fi
      
      # Create Azure ExternalSecret
      if [ "$PROVIDER" = "Azure" ]; then
        cat <<EOF | sed "s/\$CLUSTER_NAME/$CLUSTER_NAME/g" | sed "s/\$SECRET_STORE/$SECRET_STORE/g" | sed "s|\$AZURE_KEY|$AZURE_KEY|g" | oc apply -f -
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: eso-azure-creds
        namespace: \$CLUSTER_NAME
      spec:
        refreshInterval: 15s
        secretStoreRef:
          name: \$SECRET_STORE
          kind: ClusterSecretStore
        data:
        - secretKey: clientSecret
          remoteRef:
            key: \$AZURE_KEY
            property: content
        target:
          name: azure-creds
          creationPolicy: Owner
          template:
            type: Opaque
            mergePolicy: Replace
            data:
              osServicePrincipal.json: >
                {{ "{{ .clientSecret | toString | trim }}" }}
      EOF
        echo "Created ExternalSecret for Azure credentials"
      fi
      
      # Create pull secret ExternalSecret
      cat <<EOF | oc apply -f -
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: global-pullsecret
        namespace: $CLUSTER_NAME
      spec:
        refreshInterval: 15s
        secretStoreRef:
          name: $SECRET_STORE
          kind: ClusterSecretStore
        target:
          name: global-pullsecret
          creationPolicy: Owner
        data:
        - secretKey: .dockerconfigjson
          remoteRef:
            key: $PULLSECRET_KEY
            property: docker
      EOF
      echo "Created ExternalSecret for pull secret"
      
      # Wait for ExternalSecrets to sync
      echo "Waiting for ExternalSecrets to sync..."
      sleep 5
      
      # Check if secrets were created
      PROVIDER_SECRET=""
      case "$PROVIDER" in
        Amazon|AWS)
          PROVIDER_SECRET="aws-creds"
          ;;
        Google|GCP)
          PROVIDER_SECRET="gcp-creds"
          ;;
        Azure)
          PROVIDER_SECRET="azure-creds"
          ;;
      esac
      
      if [ -n "$PROVIDER_SECRET" ]; then
        echo "Waiting for $PROVIDER_SECRET secret..."
        for i in {1..30}; do
          if oc get secret $PROVIDER_SECRET -n $CLUSTER_NAME &>/dev/null; then
            echo "$PROVIDER_SECRET secret created"
            break
          fi
          sleep 2
        done
      fi
      
      echo "Waiting for global-pullsecret..."
      for i in {1..30}; do
        if oc get secret global-pullsecret -n $CLUSTER_NAME &>/dev/null; then
          echo "global-pullsecret created"
          break
        fi
        sleep 2
      done
