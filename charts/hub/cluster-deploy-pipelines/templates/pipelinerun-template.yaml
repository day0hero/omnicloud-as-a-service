apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: deploy-cluster-<cluster-name>-<timestamp>
  namespace: openshift-pipelines
  # Note: Replace <cluster-name> with actual cluster name and <timestamp> with unique identifier
spec:
  pipelineRef:
    name: deploy-cluster
  serviceAccountName: {{ .Values.serviceAccount.name }}
  params:
  # Required parameters
  - name: cluster-name
    value: ""  # e.g., "my-cluster"
  - name: base-domain
    value: ""  # e.g., "example.com"
  - name: cloud-provider
    value: ""  # One of: Amazon, Google, Azure
  - name: cloud-region
    value: ""  # e.g., "us-east-1", "us-central1", "eastus"
  - name: cluster-version
    value: "img4.20.8-x86-64-appsub"  # Default image set (check with: oc get clusterimageset)
  - name: control-plane-machine-type
    value: ""  # e.g., "m5.xlarge" (AWS), "n1-standard-4" (GCP), "Standard_D8s_v3" (Azure)
  - name: worker-machine-type
    value: ""  # e.g., "m5.4xlarge" (AWS), "n1-standard-8" (GCP), "Standard_D16s_v3" (Azure)
  
  # Optional parameters with defaults
  - name: cluster-group
    value: "devops"  # Cluster group label
  - name: control-plane-replicas
    value: "3"
  - name: worker-replicas
    value: "3"
  - name: azure-resource-group
    value: ""  # Required for Azure deployments (leave empty/null if not using Azure)
  - name: gcp-project-id
    value: ""  # Required for GCP deployments (leave empty/null if not using GCP)
  - name: ssh-public-key
    value: ""  # Optional SSH public key
  - name: secret-store-name
    value: "vault-backend"  # ClusterSecretStore name for External Secrets
  - name: aws-creds-key-path
    value: "secret/data/hub/aws"  # Vault path for AWS credentials
  - name: gcp-creds-key-path
    value: "secret/data/hub/gcp"  # Vault path for GCP credentials
  - name: azure-creds-key-path
    value: "secret/data/hub/azure"  # Vault path for Azure credentials
  - name: pullsecret-key-path
    value: "pushsecrets/global-pull-secret"  # Vault path for pull secret
  - name: timeout-minutes
    value: "90"
  workspaces:
  # Option 1: Use pre-created shared PVCs (if createPVCs: true in values.yaml)
  # - name: install-config
  #   persistentVolumeClaim:
  #     claimName: cluster-deploy-pipelines-install-config
  # - name: kubeconfig
  #   persistentVolumeClaim:
  #     claimName: cluster-deploy-pipelines-kubeconfig
  
  # Option 2: Create PVC per PipelineRun (default)
  - name: install-config
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  - name: kubeconfig
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
