# Default values for cluster-deploy-pipelines
serviceAccount:
  # Set to false if you want to use an existing ServiceAccount instead of creating one
  create: true
  name: cluster-deploy-pipelines-sa
  namespace: openshift-pipelines
  # Default service account for UI/console usage (when serviceAccountName is not specified in PipelineRun)
  # Set to "pipeline" to allow UI users to use the default pipeline service account
  # Set to the provisioned service account name to require explicit service account usage
  defaultServiceAccount: pipeline
  # Bind the default pipeline service account (for UI usage) to RBAC
  # Set to true to automatically bind the "pipeline" SA in openshift-pipelines namespace
  bindPipelineSA: true
  # Additional namespaces where ServiceAccounts should be bound to ClusterRole
  # This is useful if you have ServiceAccounts in multiple namespaces that need the same permissions
  # Each entry can specify a different ServiceAccount name if needed
  # Example: 
  #   additionalNamespaces:
  #     - namespace: hive
  #       name: pipeline  # Optional: if different from serviceAccount.name
  additionalNamespaces: []

# Image for tasks that need kubectl/oc
kubectlImage: quay.io/openshift/origin-cli:latest

# External Secrets Operator configuration
externalSecrets:
  secretStore:
    name: vault-backend
    kind: ClusterSecretStore
  awsCreds:
    key: secret/data/hub/aws
  gcpCreds:
    key: secret/data/hub/gcp
  azureCreds:
    key: secret/data/hub/azure
  pullSecret:
    key: pushsecrets/global-pull-secret

# Pipeline workspace PVCs
workspaces:
  # Set to true to create PVCs via Helm chart (shared across pipeline runs)
  # Set to false to use volumeClaimTemplate in PipelineRun (per-run PVCs)
  createPVCs: false
  installConfig:
    storageSize: 1Gi
    storageClassName: ""  # Use default storage class if empty
  kubeconfig:
    storageSize: 1Gi
    storageClassName: ""  # Use default storage class if empty
